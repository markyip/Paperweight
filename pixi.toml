[workspace]
name = "pageviewer"
version = "0.1.0"
description = "Pageviewer — lightweight PDF / EPUB reader"
authors = ["Mark Yip"]
channels = ["conda-forge"]
platforms = ["win-64", "osx-arm64", "osx-64", "linux-64"]

[tasks]
start = "python src/main.py"
test = "python tests/test_reader.py"

[dependencies]
python = ">=3.10,<3.13"
pip = "*"

[pypi-dependencies]
PyQt6 = ">=6.6.0"
numpy = ">=2.0.0"
Pillow = ">=10.0.0"
pypdfium2 = ">=5.0.0"
