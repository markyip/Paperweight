name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tauri/package-lock.json
      - run: npm ci
      - run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            tauri/src-tauri/target/release/paperweight.exe
            tauri/src-tauri/target/release/bundle/nsis/*.exe

  macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tauri/package-lock.json
      - run: npm ci
      - run: npm run tauri build
      - run: ditto -c -k --keepParent src-tauri/target/release/bundle/macos/Paperweight.app Paperweight.app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            tauri/Paperweight.app.zip
            tauri/src-tauri/target/release/bundle/dmg/*.dmg
